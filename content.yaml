# Project page content. Edit this file, then run: python3 build.py
#
# Text values:
#   title: Same text for every language
#   title: {en: English text, ko: 한국어 텍스트}
#   body:                       # long text: blank lines separate paragraphs
#     en: |
#       First paragraph.
#
#       Second paragraph.
#     ko: |
#       첫 번째 문단.
# Text may contain inline HTML: <a href="...">, <strong>, <em>, <br>.
# Media paths are relative to docs/ (e.g. media/demo.mp4). .mp4/.webm play as
# looping muted videos; other files (.png, .jpg, .svg, .gif) are shown as images.

# First language is the default. Use [en] or [ko] for a single-language page
# (the language toggle is then hidden).
languages: [en, ko]

lab:
  name: iCIR Lab
  url: https://sites.google.com/view/icir-lab/%ED%99%88
  logo: assets/lab-logo.png

title:
  en: Project Title Goes Here
  ko: 프로젝트 제목을 입력하세요

authors:
  - name: {en: First Author, ko: 첫째 저자}
    url: https://github.com/your-id      # optional
    affiliations: [1]                     # optional superscript numbers
  - name: {en: Second Author, ko: 둘째 저자}
    affiliations: [1, 2]

# One line per affiliation; numbered automatically when authors use affiliations.
affiliations:
  - en: <a href="https://sites.google.com/view/icir-lab/%ED%99%88">iCIR Lab</a> · Department of Mechatronics Engineering, Chungnam National University
    ko: <a href="https://sites.google.com/view/icir-lab/%ED%99%88">iCIR Lab</a> · 충남대학교 메카트로닉스공학과
  - Second Affiliation

# Buttons under the title. icon: code | paper | video | data | link
links:
  - label: Code
    url: https://github.com/iCIRLab/your-repo
    icon: code
  - label: {en: Paper, ko: 논문}
    url: https://example.com/paper.pdf
    icon: paper

# Main demo below the title. Remove this block if there is no demo.
demo:
  title: {en: Demo Video, ko: 데모 영상}  # optional; this is the default
  media: media/placeholder.svg             # e.g. media/demo.mp4
  intro:
    en: One sentence describing what the demo shows.
    ko: 데모에서 보여주는 내용을 한 문장으로 설명합니다.
  note: {en: "Playback: 4× speed", ko: "재생 속도: 4배속"}

# Sections appear in this order, in the menu and on the page.
# type: abstract | overview | cases | text
# Every section accepts: id (menu anchor), kicker (small caps line above the
# title), title, intro (one-line lead), band (true/false tinted background).
sections:
  # Gallery of clips, two per row on desktop. Cards are numbered CASE 01, 02, ...
  - type: cases
    # title defaults to Case videos / 케이스별 영상
    kicker: {en: SAME ENVIRONMENT · DIFFERENT CASES, ko: 같은 환경 · 다른 조건}
    intro:
      en: What the cases have in common and how they differ.
      ko: 케이스들의 공통점과 차이점을 설명합니다.
    summary: {en: 3 cases · 4× speed, ko: 3개 케이스 · 4배속}  # optional line above the grid
    meta: {en: 4× speed, ko: 4배속}                              # right-hand label on every card
    items:
      - media: media/placeholder.svg      # e.g. media/cases/case1.mp4
        title: {en: First case, ko: 첫 번째 케이스}
        text: {en: What happens in this clip., ko: 이 영상에서 보여주는 상황입니다.}
      - media: media/placeholder.svg
        title: {en: Second case, ko: 두 번째 케이스}
        text: {en: What happens in this clip., ko: 이 영상에서 보여주는 상황입니다.}
      - media: media/placeholder.svg
        title: {en: Third case, ko: 세 번째 케이스}
        text: {en: An odd last card is centered., ko: 마지막 카드가 홀수 번째이면 가운데에 놓입니다.}

  - type: abstract
    # title defaults to Abstract / 초록
    body:
      en: |
        Summarize the problem and why it matters.

        Describe the approach, the experiments and the main result.
      ko: |
        연구 문제와 그 중요성을 요약합니다.

        제안 방법, 실험, 주요 결과를 설명합니다.

  # A step diagram. Each stage gets a number; `arrow` labels the arrow into it.
  # A stage with `loop` is drawn as a repeated cycle; `outcome` adds a box to its right.
  # To use your own figure instead, replace `flow` with `media` (and an optional `caption`).
  - type: overview
    # title defaults to System overview / 시스템 개요
    intro:
      en: How the system works, from sensing to the final decision.
      ko: 감지부터 최종 결정까지 시스템의 전체 흐름입니다.
    flow:
      - title: {en: Sense, ko: 감지}
        text: {en: Collect measurements, ko: 측정값을 수집합니다}
        tag: INPUT
      - arrow: {en: Trigger condition met, ko: 시작 조건 충족}
        title: {en: Iterate, ko: 반복}
        tag: LOOP
        text: {en: Repeat until the stopping rule is met., ko: 종료 조건을 만족할 때까지 반복합니다.}
        loop:
          - title: {en: Estimate, ko: 추정}
            text: {en: Update the model, ko: 모델 갱신}
          - title: {en: Plan, ko: 계획}
            text: {en: Choose the next action, ko: 다음 행동 선택}
          - title: {en: Act, ko: 실행}
            text: {en: Move and measure, ko: 이동 및 측정}
        feedback: {en: Feed new observations back, ko: 새 관측을 다시 반영}
      - arrow: {en: Stopping rule met, ko: 종료 조건 충족}
        title: {en: Decide, ko: 결정}
        text: {en: Record the result, ko: 결과를 기록합니다}
        outcome:
          tag: {en: DONE, ko: 완료}
          title: {en: Evaluate, ko: 평가}
          text: {en: Time · Error, ko: 시간 · 오차}
    caption:
      en: Optional caption under the diagram.
      ko: 그림 아래에 표시할 설명(선택).

  # Free-form section: any title, paragraphs and an optional figure.
  # - type: text
  #   id: results
  #   title: {en: Results, ko: 결과}
  #   body: {en: Paragraphs..., ko: 문단...}
  #   media: media/results.png
  #   caption: {en: Figure caption, ko: 그림 설명}
